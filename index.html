<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIAP GameList</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ========== TELA DE LOGIN ========== -->
  <div id="login-screen" class="screen active">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">GAME<strong>LIST</strong></span>
      </div>
      <p class="login-subtitle">Acesse sua lista de favoritos</p>

      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Digite sua senha" />
      </div>

      <p id="login-error" class="error-msg" aria-live="polite"></p>

      <button id="login-btn" onclick="handleLogin()">Entrar</button>
    </div>
  </div>

  <!-- ========== TELA PRINCIPAL ========== -->
  <div id="main-screen" class="screen">

    <header class="app-header">
      <div class="header-brand">
        <span class="logo-icon">◈</span>
        <span class="logo-text">GAME<strong>LIST</strong></span>
      </div>
      <button class="logout-btn" onclick="handleLogout()">Sair</button>
    </header>

    <main class="app-main">
      <div class="panel">
        <h2 class="panel-title">Meus Jogos Favoritos</h2>
        <p class="panel-count"><span id="game-count">0</span> jogos na lista</p>

        <!-- Adicionar jogo -->
        <div class="add-section">
          <input type="text" id="new-game-input" placeholder="Nome do jogo..." maxlength="60" />
          <div class="add-buttons">
            <button class="btn-add-start" onclick="addGameAtStart()">+ Início</button>
            <button class="btn-add-end"   onclick="addGameAtEnd()">  + Fim</button>
          </div>
        </div>
        <p id="add-error" class="error-msg" aria-live="polite"></p>

        <!-- Lista de jogos -->
        <ol id="game-list"></ol>
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
